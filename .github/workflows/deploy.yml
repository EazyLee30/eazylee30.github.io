name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      update_stock_data:
        description: "Run MX A-share data pipeline before deploy"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      stock_mode:
        description: "MX pipeline mode"
        required: true
        default: "postclose"
        type: choice
        options:
          - premarket
          - open
          - midday
          - postclose
          - weekend
          - exhaustive
          - mock
      call_budget:
        description: "MX call budget for this run"
        required: true
        default: "180"
      detail_limit:
        description: "Max per-stock detail queries"
        required: true
        default: "120"
  schedule:
    # 08:20 Asia/Shanghai, weekday pre-market refresh.
    - cron: "20 0 * * 1-5"
    # 09:35 Asia/Shanghai, weekday market-open refresh.
    - cron: "35 1 * * 1-5"
    # 12:45 Asia/Shanghai, weekday mid-day refresh.
    - cron: "45 4 * * 1-5"
    # 15:45 Asia/Shanghai, weekday post-close refresh.
    - cron: "45 7 * * 1-5"
    # 09:30 Asia/Shanghai, weekend news-only refresh.
    - cron: "30 1 * * 6,0"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      actions: write
      pages: write
      id-token: write
    env:
      MX_APIKEY: ${{ secrets.MX_APIKEY }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve stock data budget
        id: stock
        shell: bash
        run: |
          update="false"
          mode="postclose"
          budget="0"
          detail_limit="0"

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            update="true"
            if [[ "${{ github.event.schedule }}" == "20 0 * * 1-5" ]]; then
              mode="premarket"
              budget="90"
              detail_limit="60"
            elif [[ "${{ github.event.schedule }}" == "35 1 * * 1-5" ]]; then
              mode="open"
              budget="80"
              detail_limit="60"
            elif [[ "${{ github.event.schedule }}" == "45 4 * * 1-5" ]]; then
              mode="midday"
              budget="110"
              detail_limit="80"
            else
              mode="postclose"
              budget="200"
              detail_limit="150"
            fi
            if [[ "${{ github.event.schedule }}" == "30 1 * * 6,0" ]]; then
              mode="weekend"
              budget="80"
              detail_limit="0"
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            update="${{ inputs.update_stock_data }}"
            mode="${{ inputs.stock_mode }}"
            budget="${{ inputs.call_budget }}"
            detail_limit="${{ inputs.detail_limit }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            update="true"
            cn_weekday="$(TZ=Asia/Shanghai date +%u)"
            cn_hhmm="$(TZ=Asia/Shanghai date +%H%M)"
            cn_minutes=$((10#${cn_hhmm:0:2} * 60 + 10#${cn_hhmm:2:2}))
            if [[ "${cn_weekday}" == "6" || "${cn_weekday}" == "7" ]]; then
              # Weekend mode preserves the previously deployed screener list for news-only refreshes.
              # On code pushes we need a full screener pass so newly added strategies reach latest.json.
              mode="exhaustive"
              budget="110"
              detail_limit="0"
            elif (( cn_minutes < 570 )); then
              mode="premarket"
              budget="90"
              detail_limit="60"
            elif (( cn_minutes <= 690 )); then
              mode="open"
              budget="80"
              detail_limit="60"
            elif (( cn_minutes < 780 )); then
              mode="midday"
              budget="110"
              detail_limit="80"
            elif (( cn_minutes <= 900 )); then
              mode="open"
              budget="80"
              detail_limit="60"
            else
              mode="postclose"
              budget="200"
              detail_limit="150"
            fi
          fi

          if [[ -z "${MX_APIKEY}" && "${mode}" != "mock" ]]; then
            echo "MX_APIKEY is not configured; deploying existing stock/cn seed data."
            update="false"
          fi

          echo "update=${update}" >> "$GITHUB_OUTPUT"
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "budget=${budget}" >> "$GITHUB_OUTPUT"
          echo "detail_limit=${detail_limit}" >> "$GITHUB_OUTPUT"

      - name: Generate A-share dashboard data
        if: steps.stock.outputs.update == 'true'
        timeout-minutes: 25
        run: >
          python3 scripts/mx_cn_pipeline.py
          --mode "${{ steps.stock.outputs.mode }}"
          --call-budget "${{ steps.stock.outputs.budget }}"
          --detail-limit "${{ steps.stock.outputs.detail_limit }}"
          --request-timeout 12
          --history-days 20
          --output stock/cn/data/latest.json

      - name: Preserve deployed stock data
        if: steps.stock.outputs.update != 'true'
        shell: bash
        run: |
          mkdir -p stock/cn/data
          curl -fsSL --retry 2 --max-time 10 \
            "https://eazylee.xyz/stock/cn/data/latest.json?t=$(date +%s)" \
            -o stock/cn/data/latest.json || true
      
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare static artifact
        shell: bash
        run: |
          mkdir -p _site
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.DS_Store' \
            --exclude='_site' \
            -cf - . | tar -xf - -C _site
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
          retention-days: 1
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Clean up Pages artifacts
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            "/repos/${{ github.repository }}/actions/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' |
          while read -r artifact_id; do
            gh api --method DELETE \
              "/repos/${{ github.repository }}/actions/artifacts/${artifact_id}"
          done
